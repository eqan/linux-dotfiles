[Options]
close_on_unfocus_delay_ms=@ByteArray(250)
maxitems=500
number_search=true
style=@ByteArray(Fusion)
tabs=&clipboard

[Theme]
alt_bg=#282828
alt_item_css=
bg=#1d2021
css=
css_template_items=items
css_template_main_window=main_window
css_template_menu=menu
css_template_notification=notification
cur_item_css="\n    ;border: 1px solid ${sel_bg}"
edit_bg=#282828
edit_fg=#ebdbb2
edit_font="Roboto,10,-1,5,50,0,0,0,0,0"
fg=#ebdbb2
find_bg=#d79921
find_fg=#1d2021
find_font="Roboto,10,-1,5,50,0,0,0,0,0"
font="Roboto,10,-1,5,50,0,0,0,0,0"
font_antialiasing=true
hover_item_css="\n    ;background: #3c3836"
icon_size=8
item_css="\n    ;padding: 0.3em 0.5em 0.5em 0.5em"
item_spacing=0
menu_bar_css="\n    ;background: ${bg}\n    ;color: ${fg}\n    ;padding: 0.15em"
menu_bar_disabled_css=
menu_bar_selected_css="\n    ;background: ${sel_bg}\n    ;color: ${sel_fg}"
menu_css="\n    ;background: ${alt_bg}\n    ;color: ${fg}\n    ;border: 1px solid #665c54"
notes_bg=#3c3836
notes_css=
notes_fg=#ebdbb2
notes_font="Roboto,10,-1,5,50,0,0,0,0,0"
notification_bg=#282828
notification_fg=#ebdbb2
notification_font="Roboto,10,-1,5,50,0,0,0,0,0"
num_fg=#928374
num_font="Roboto Mono,8,-1,5,50,0,0,0,0,0"
num_margin=2
num_sel_fg=#fbf1c7
search_bar="\n    ;background: ${find_bg}\n    ;color: ${find_fg}\n    ;padding: 0.2em\n    ;border: 1px solid ${find_bg}"
search_bar_focused="\n    ;border: 1px solid ${sel_bg}"
sel_bg=#458588
sel_fg=#fbf1c7
sel_item_css=
show_number=true
show_scrollbars=false
style_main_window=true
tab_bar_css="\n    ;background: ${bg}"
tab_bar_item_counter="\n    ;color: #d79921\n    ;font-size: 6pt"
tab_bar_scroll_buttons_css="\n    ;background: ${bg}\n    ;color: ${fg}\n    ;border: 0"
tab_bar_sel_item_counter="\n    ;color: #fabd2f"
tab_bar_tab_selected_css="\n    ;background: ${alt_bg}\n    ;color: ${fg}\n    ;padding: 0.2em\n    ;border: 1px solid ${sel_bg}"
tab_bar_tab_unselected_css="\n    ;background: ${bg}\n    ;color: ${num_fg}\n    ;padding: 0.2em\n    ;border: 1px solid ${bg}"
tab_tree_css="\n    ;background: ${bg}\n    ;color: ${num_fg}"
tab_tree_item_counter="\n    ;color: #d79921\n    ;font-size: 6pt"
tab_tree_sel_item_counter="\n    ;color: #fabd2f"
tab_tree_sel_item_css="\n    ;background: ${bg}\n    ;color: ${fg}\n    ;text-decoration: underline"
tool_bar_css="\n    ;background: ${bg}\n    ;color: ${fg}\n    ;border: 0"
tool_button_css="\n    ;background: ${bg}\n    ;color: ${fg}\n    ;border: 0"
tool_button_pressed_css="\n    ;background: #665c54"
tool_button_selected_css="\n    ;background: ${sel_bg}\n    ;color: ${sel_fg}"
use_system_icons=false
